services:
  # Backend API service
  backend:
    build: 
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/smarthome
    depends_on:
      - db
    volumes:
      - ./backend/src:/app/src
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - app-network

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=smarthome
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network

  # Mobile Expo dev server
  mobile:
    build: 
      context: .
      dockerfile: Dockerfile.mobile
    ports:
      - "8081:8081"    # Expo dev server
      - "19000:19000"  # Expo DevTools
      - "19001:19001"  # Expo iOS port
      - "19002:19002"  # Expo Android port
    volumes:
      - ./mobile:/app
      - /app/node_modules
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=localhost
    stdin_open: true
    tty: true
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
